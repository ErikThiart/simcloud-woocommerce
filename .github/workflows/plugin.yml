name: Plugin tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            wp: '6.8.3'
            wc: '10.0.4'
            hpos: 'no'
          - php: '8.4'
            wp: '7.1.3'
            wc: '11.2.1'
            hpos: 'yes'
          - php: '8.5'
            wp: '7.1.3'
            wc: '11.2.1'
            hpos: 'yes'
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, curl, zip, intl, gd
          coverage: none
          ini-values: memory_limit=512M, error_reporting=E_ALL
      - name: Prepare isolated WordPress and WooCommerce
        env:
          WP_VERSION: ${{ matrix.wp }}
          WC_VERSION: ${{ matrix.wc }}
          HPOS: ${{ matrix.hpos }}
          WP_TEST_DB_PASS: test-only
        run: bash scripts/setup-tests.sh
      - name: Run real database, checkout, fulfilment and concurrent-worker tests
        run: bash scripts/test.sh
      - name: Build installable ZIP
        run: python3 scripts/package.py
      - name: Install and exercise exact release ZIP
        run: bash scripts/test-package.sh
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostics-${{ matrix.php }}
          path: /tmp/simcloud-wc-tests/wordpress/wp-content/debug.log
          if-no-files-found: ignore
